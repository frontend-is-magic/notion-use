name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check-package.py
      - run: node --test plugins/notion-use/tests/*.test.cjs
      - run: python3 scripts/build-web-skill.py --out work/notion-use-web-skill.zip
